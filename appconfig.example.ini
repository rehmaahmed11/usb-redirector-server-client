# Mini USB Bridge - example configuration
# Copy to %LOCALAPPDATA%\MiniUsbBridge\settings.ini
# (the app creates this file itself; every key is optional)

# --- server ---
serverPort=4437
codeTtlSeconds=300
singleUseCode=1
autoShareAll=0
# Put your DDNS name or public IP here when the server has a reachable inbound port.
publicHost=

# --- relay (NAT traversal) ---
# Set the same host/port on both PCs, then enable on both.
relayHost=
relayPort=4443
relayEnabled=0

# --- client ---
# Loopback port handed to usbip.exe --tcp-port
tunnelPort=4240
autoDetachOnExit=1
verifyAttachWithSetupApi=1

# --- backends (leave empty to search PATH and the default install dirs) ---
usbipdPath=
usbipPath=

# --- misc ---
firewallHardened=0
minimizeToTray=0
logLevel=1
logPath=
