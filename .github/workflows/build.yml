name: build

# Runs on every merge to main and on every pull request.
#
# Produces: MiniUsbBridge.exe, mubb-relay.exe, the Inno Setup installer and a
# tool chain report for the run. The report answers "what happened": every stage,
# its command, its exit code, its duration, the tool versions involved, the tail
# of the failing log and the SHA-256 of each artifact. It is uploaded as an
# artifact, mirrored into the run summary, and posted as a PR comment so it is
# readable without the Actions log viewer.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core + relay + installer lint (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the MinGW-w64 cross compiler (Windows XP target compile check)
        # ci/xp-compile-check.sh compiles every source with -D_WIN32_WINNT=0x0501,
        # where the headers hide post-XP APIs. It skips cleanly without a compiler.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++-mingw-w64-i686

      - name: Portable core, relay, XP-compatibility and installer-source checks
        run: bash ci/linux-check.sh

      - name: Upload tool chain report (Linux)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-report-linux
          path: dist/ci/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish tool chain report (Linux)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoProfile -File ci/publish-report.ps1 -Marker "<!-- mub-ci-report-linux -->" -Title "Tool chain report - Linux (core, relay, installer sources)"

  windows-legacy:
    name: Legacy Windows build (Vista - 11) + installer
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the Vista-target binary (static CRT) and its installer
        # Proves the -MinWin path works without the Visual Studio 2022-only
        # toolchain assumptions: _WIN32_WINNT=0x0600, static runtime,
        # MiniUsbBridgeLegacy.iss (Windows 7 SP1+), PE import check.
        run: ./build.ps1 -MinWin vista -Installer

      - name: Upload legacy artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MiniUsbBridge-windows-legacy
          path: |
            dist/app-legacy/MiniUsbBridge.exe
            dist/app-legacy/mubb-relay.exe
            dist/MiniUsbBridge-*-legacy-setup.exe
          if-no-files-found: warn
          retention-days: 30

  windows:
    name: Windows build + installer
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check the CI scripts
        # If a CI script has a parse error, say so in a file the reporter can
        # read, instead of failing with a bare "exit code 1".
        run: |
          New-Item -ItemType Directory -Force dist/ci | Out-Null
          $problems = @()
          foreach ($f in @("ci/windows-build.ps1", "ci/publish-report.ps1")) {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$parseErrors)
            if ($parseErrors) {
              foreach ($e in $parseErrors) { $problems += "$f`:$($e.Extent.StartLineNumber): $($e.Message)" }
            }
          }
          if ($problems.Count -gt 0) {
            $problems | Set-Content dist/ci/00-syntax.txt
            $problems | ForEach-Object { Write-Host $_ }
            exit 1
          }
          "no syntax errors in ci/windows-build.ps1 or ci/publish-report.ps1" | Set-Content dist/ci/00-syntax.txt

      - name: Build, test, compile installer, write tool chain report
        # The script writes dist/ci/toolchain-report.md from a finally block, so
        # the report exists even when a stage fails.
        run: ./ci/windows-build.ps1

      - name: Legacy Windows import report (informational)
        # Proves our own code does not statically import APIs that older Windows
        # (XP/Vista/7/8/8.1) do not have - wincompat.cpp must resolve them at
        # runtime. Not blocking: with the Windows 10 CRT some of these names come
        # from the runtime DLLs, not from this program.
        if: always()
        run: |
          New-Item -ItemType Directory -Force dist/ci | Out-Null
          if (Test-Path dist/app/MiniUsbBridge.exe) {
            python ci/check_legacy_compat.py --exe dist/app/MiniUsbBridge.exe --target win10 |
              Tee-Object -FilePath dist/ci/legacy-imports.txt
            if ($LASTEXITCODE -ne 0) {
              Write-Host "informational: see dist/ci/legacy-imports.txt (post-XP imports above)" -ForegroundColor Yellow
            }
          } else {
            "no binary to check" | Set-Content dist/ci/legacy-imports.txt
          }

      - name: Upload tool chain report (Windows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-report-windows
          path: dist/ci/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload app and installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MiniUsbBridge-windows-x64
          path: |
            dist/app/MiniUsbBridge.exe
            dist/app/mubb-relay.exe
            dist/MiniUsbBridge-*-setup.exe
            dist/ci/SHA256SUMS.txt
            dist/ci/toolchain-report.md
          if-no-files-found: warn
          retention-days: 30

      - name: Publish tool chain report (Windows)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoProfile -File ci/publish-report.ps1 -Marker "<!-- mub-ci-report-windows -->" -Title "Tool chain report - Windows (MSVC build, tests, Inno Setup installer)"

      - name: Job summary
        if: always()
        run: |
          if (Test-Path dist/ci/toolchain-report.md) {
            Get-Content dist/ci/toolchain-report.md | Add-Content $env:GITHUB_STEP_SUMMARY
          } else {
            "No tool chain report was produced - the build script failed before it could write one." | Add-Content $env:GITHUB_STEP_SUMMARY
          }
